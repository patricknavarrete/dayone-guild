<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Forgot Password — DayOne Guild</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ static_ver }}">
</head>
<body>
<div class="bg-field"></div>
<div class="bg-grid"></div>
<div class="bg-noise"></div>
<div class="bg-scanlines"></div>
<div class="bg-vignette"></div>

<div class="auth-shell">
  <div class="auth-overlay-grid"></div>
  <div class="auth-scanline"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-logo">D1</div>
      <div>
        <div class="auth-brand-name">DayOne</div>
        <div class="auth-brand-sub">Password Recovery</div>
      </div>
    </div>

    <div class="auth-title">Forgot Password</div>
    <p style="font-size:11px;color:var(--ink-mute);margin-bottom:18px;letter-spacing:0.04em;">
      Enter your registered email address and we'll send you a reset link.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('forgot_password') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="auth-field">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="your@email.com" required autofocus>
      </div>
      <button type="submit" class="btn solid" style="width:100%;justify-content:center;">Send Reset Link</button>
    </form>

    <div class="auth-foot">
      <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}?v={{ static_ver }}"></script>
</body>
</html>
