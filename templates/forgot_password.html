<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — DayOne Guild</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">
        <div class="hexagon">D1</div>
        <span class="guild-name">DayOne</span>
      </div>
      <h2>Forgot Password</h2>
      <p style="text-align:center;font-size:0.85rem;color:var(--text-muted);margin-bottom:1.25rem;">
        Enter your registered email address and we'll send you a reset link.
      </p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('forgot_password') }}">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="your@email.com" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">
          Send Reset Link
        </button>
      </form>

      <div style="text-align:center;margin-top:1.25rem;">
        <a href="{{ url_for('login') }}" style="font-size:0.85rem;color:var(--text-muted);">← Back to Login</a>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
