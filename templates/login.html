<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DayOne Guild</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">
        <div class="hexagon">D1</div>
        <span class="guild-name">DayOne</span>
      </div>
      <h2>Member Login</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Your username" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg" style="width:100%;justify-content:center;">Sign In</button>
      </form>

      <div style="text-align:center;margin-top:0.85rem;">
        <a href="{{ url_for('forgot_password') }}" style="font-size:0.82rem;color:var(--text-muted);">Forgot your password?</a>
      </div>

      <div style="text-align:center;margin-top:0.75rem;">
        <span class="text-muted" style="font-size:0.85rem;">Not a member yet?</span>
        <a href="{{ url_for('register') }}" style="font-size:0.85rem;margin-left:0.35rem;">Register here</a>
      </div>

      <div style="text-align:center;margin-top:0.75rem;">
        <a href="{{ url_for('admin_login') }}" style="font-size:0.78rem;color:var(--text-muted);">Admin panel →</a>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
