<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password — DayOne Guild</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ static_ver }}">
</head>
<body>
<div class="bg-field"></div>
<div class="bg-grid"></div>
<div class="bg-noise"></div>
<div class="bg-scanlines"></div>
<div class="bg-vignette"></div>

<div class="auth-shell">
  <div class="auth-overlay-grid"></div>
  <div class="auth-scanline"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-logo">D1</div>
      <div>
        <div class="auth-brand-name">DayOne</div>
        <div class="auth-brand-sub">Set New Password</div>
      </div>
    </div>

    <div class="auth-title">Reset Password</div>
    <p style="font-size:11px;color:var(--ink-mute);margin-bottom:18px;">Enter your new password below.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('reset_password', token=token) }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="auth-field">
        <label>New Password</label>
        <input type="password" name="password" id="new-pw" placeholder="Minimum 6 characters" required minlength="6" autofocus autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" id="new-pw-confirm" placeholder="Repeat new password" required minlength="6" autocomplete="new-password">
        <span class="auth-hint" id="reset-hint" style="display:none;"></span>
      </div>
      <button type="submit" class="btn solid" style="width:100%;justify-content:center;">Set New Password</button>
    </form>

    <div class="auth-foot">
      <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}?v={{ static_ver }}"></script>
<script>
const pw1  = document.getElementById('new-pw');
const pw2  = document.getElementById('new-pw-confirm');
const hint = document.getElementById('reset-hint');
const form = document.querySelector('form');
function checkMatch() {
  if (!pw2.value) { hint.style.display = 'none'; return; }
  if (pw1.value === pw2.value) {
    hint.style.display = 'block'; hint.style.color = 'var(--green)'; hint.textContent = '✓ Passwords match';
  } else {
    hint.style.display = 'block'; hint.style.color = 'var(--red)'; hint.textContent = '✕ Passwords do not match';
  }
}
pw1.addEventListener('input', checkMatch);
pw2.addEventListener('input', checkMatch);
form.addEventListener('submit', function(e) {
  if (pw1.value !== pw2.value) {
    e.preventDefault();
    hint.style.display = 'block'; hint.style.color = 'var(--red)'; hint.textContent = '✕ Passwords do not match';
    pw2.focus();
  }
});
</script>
</body>
</html>
