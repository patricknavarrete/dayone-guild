<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — DayOne Guild</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">
        <div class="hexagon">D1</div>
        <span class="guild-name">DayOne</span>
      </div>
      <h2>Reset Password</h2>
      <p style="text-align:center;font-size:0.85rem;color:var(--text-muted);margin-bottom:1.25rem;">
        Enter your new password below.
      </p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('reset_password', token=token) }}">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" name="password" id="new-pw" class="form-control"
                 placeholder="Minimum 6 characters" required minlength="6" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" name="confirm_password" id="new-pw-confirm" class="form-control"
                 placeholder="Repeat new password" required minlength="6">
          <p class="form-hint" id="reset-hint" style="display:none;"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">
          Set New Password
        </button>
      </form>

      <div style="text-align:center;margin-top:1.25rem;">
        <a href="{{ url_for('login') }}" style="font-size:0.85rem;color:var(--text-muted);">← Back to Login</a>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    const pw1  = document.getElementById('new-pw');
    const pw2  = document.getElementById('new-pw-confirm');
    const hint = document.getElementById('reset-hint');
    const form = document.querySelector('form');

    function checkMatch() {
      if (!pw2.value) { hint.style.display = 'none'; return; }
      if (pw1.value === pw2.value) {
        hint.style.display = 'block';
        hint.style.color   = 'var(--green)';
        hint.textContent   = '✓ Passwords match';
      } else {
        hint.style.display = 'block';
        hint.style.color   = 'var(--absent)';
        hint.textContent   = '✕ Passwords do not match';
      }
    }

    pw1.addEventListener('input', checkMatch);
    pw2.addEventListener('input', checkMatch);

    form.addEventListener('submit', function(e) {
      if (pw1.value !== pw2.value) {
        e.preventDefault();
        hint.style.display = 'block';
        hint.style.color   = 'var(--absent)';
        hint.textContent   = '✕ Passwords do not match';
        pw2.focus();
      }
    });
  </script>
</body>
</html>
